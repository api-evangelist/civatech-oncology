aid: civatech-oncology
name: CivaTech Oncology
description: 'CivaTech Oncology is a Durham, North Carolina medical device manufacturer
  that develops polymer-encapsulated low dose rate (LDR) brachytherapy radiation sources
  for the treatment of solid tumors. Its FDA-cleared product line includes CivaSheet,
  a flexible, bioabsorbable, unidirectional planar source that can be custom-sized
  in the operating room and shields healthy tissue; CivaString, a polymer-encapsulated
  brachytherapy seed used for prostate and other localized cancers; and CivaDerm for
  dermatological applications. The company markets to radiation oncologists and surgical
  teams across pancreatic, sarcoma, colorectal, gynecologic, head and neck, lung and
  prostate indications, and its research has been supported by NIH/NCI and SBIR programs.
  It publishes no public developer program, API, SDK, or machine-readable specification.'
